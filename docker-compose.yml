services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-railsafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railsafe}
      POSTGRES_DB: ${POSTGRES_DB:-railsafe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-railsafe} -d ${POSTGRES_DB:-railsafe}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [railsafe_net]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-railsafe}:${POSTGRES_PASSWORD:-railsafe}@db:5432/${POSTGRES_DB:-railsafe}
      JWT_SECRET: ${JWT_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-admin@railsafe.local}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-Admin12345!}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      TWO_FACTOR_ENABLED: ${TWO_FACTOR_ENABLED:-false}
      TWO_FACTOR_SECRET: ${TWO_FACTOR_SECRET:-dev-two-factor-secret-change-me}
      TWO_FACTOR_TTL_SECONDS: ${TWO_FACTOR_TTL_SECONDS:-300}
      TWO_FACTOR_MAX_ATTEMPTS: ${TWO_FACTOR_MAX_ATTEMPTS:-5}
      PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS:-600}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
    depends_on:
      db:
        condition: service_healthy
    networks: [railsafe_net]
    restart: unless-stopped

  frontend-build:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    volumes:
      - ./frontend:/app
      - frontend_dist:/dist
    command: sh -c "if [ -f package-lock.json ]; then npm ci; else npm install; fi && npm run build && rm -rf /dist/* && cp -r dist/* /dist/"
    networks: [railsafe_net]

  nginx:
    build: ./nginx
    ports:
      - "${APP_PORT:-443}:443"
    environment:
      TLS_COMMON_NAME: ${TLS_COMMON_NAME:-RailSafe}
      TLS_SAN: ${TLS_SAN:-DNS:localhost}
      TLS_CERT_DAYS: ${TLS_CERT_DAYS:-365}
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - tls_data:/etc/nginx/tls
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    networks: [railsafe_net]
    restart: unless-stopped

volumes:
  pgdata:
  frontend_dist:
  tls_data:

networks:
  railsafe_net:
    driver: bridge
