services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-railsafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railsafe}
      POSTGRES_DB: ${POSTGRES_DB:-railsafe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-railsafe} -d ${POSTGRES_DB:-railsafe}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [railsafe_net]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-railsafe}:${POSTGRES_PASSWORD:-railsafe}@db:5432/${POSTGRES_DB:-railsafe}
      JWT_SECRET: ${JWT_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-admin@railsafe.local}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-Admin12345!}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    networks: [railsafe_net]
    restart: unless-stopped

  frontend-build:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    volumes:
      - ./frontend:/app
      - frontend_dist:/dist
    command: sh -c "npm install && npm run build && rm -rf /dist/* && cp -r dist/* /dist/"
    networks: [railsafe_net]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    networks: [railsafe_net]
    restart: unless-stopped

volumes:
  pgdata:
  frontend_dist:

networks:
  railsafe_net:
    driver: bridge
